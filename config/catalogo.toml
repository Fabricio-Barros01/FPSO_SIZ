# Catálogo de aplicações — o que o menu de abertura mostra.
#
# Fica aqui, e não no código, pela mesma razão que as constantes das correlações:
# acrescentar uma aplicação não pode exigir editar Julia, e o que o programa promete ao
# usuário tem de estar num lugar que se lê sem compilar nada.
#
# Um teste amarra este arquivo ao registro do core: todo box `ativo` que declare
# `equipment`/`method` tem de resolver em `equipments()`/`methods_for()`. Assim o menu
# não consegue prometer o que o core não tem.
#
# Campos:
#   id         identificador na URL (/app/<id>) e chave do estado no servidor
#   titulo     o que o cartão mostra em destaque
#   subtitulo  o método ou a norma, uma linha
#   icone      nome do desenho em public/icones.js
#   estado     "ativo" | "em_breve"
#   motivo     por que ainda não está pronto (obrigatório quando em_breve)
#   equipment  id do AbstractEquipment no registro   (só para os que são vasos)
#   method     id do AbstractSizingMethod no registro

# ---------------------------------------------------------------------------
# Prontos
#
# Cada um destes declara a fonte no subtítulo, e é ela que o memorial exportado cita
# (`method_reference`). Onde a fonte não cobre tudo, o limite está escrito no TOML do
# método e chega ao usuário pelo `note` do campo que carrega a premissa — o `h_casco` do
# trocador e o `dm_water` do tratador são os dois casos.
# ---------------------------------------------------------------------------

[[box]]
id        = "separador-3f"
titulo    = "Separador trifásico horizontal"
subtitulo = "Óleo, água e gás — Stewart & Arnold (2008), via Alves & Komesu (2025)"
icone     = "separador3f"
estado    = "ativo"
equipment = "separator"
method    = "stewart_arnold"

[[box]]
id        = "knockout-2f"
titulo    = "Vaso de knockout bifásico"
subtitulo = "Gás e líquido, meio cheio — Stewart & Arnold (2008), cap. 3"
icone     = "knockout2f"
estado    = "ativo"
equipment = "knockout"
method    = "stewart_arnold_2f"

[[box]]
id        = "vaso-eletrostatico"
titulo    = "Tratador eletrostático"
subtitulo = "Emulsão água-óleo, vaso cheio de líquido — Stewart & Arnold (2008), §4.7-4.9"
icone     = "eletrostatico"
estado    = "ativo"
equipment = "treater"
method    = "arnold_electrostatic"

[[box]]
id        = "bomba-centrifuga"
titulo    = "Bomba centrífuga"
subtitulo = "Carga do sistema, NPSH e potência — Moran (CEP, 2016)"
icone     = "bomba"
estado    = "ativo"
equipment = "pump"
method    = "moran"

[[box]]
id        = "trocador-calor"
titulo    = "Trocador casco-e-tubos"
subtitulo = "LMTD com fator F, U das resistências — Saari (LUT). Dimensiona UM trocador"
icone     = "trocador"
estado    = "ativo"
equipment = "exchanger"
method    = "saari_lmtd"

# O subtítulo acima dizia "Sem análise pinch" enquanto não havia nenhuma. Agora há, e a
# frase passaria a mentir por omissão — sugeriria que o programa não a tem, quando o que
# ela sempre quis dizer é que ESTE box não a faz. O que ele faz é dimensionar um
# trocador; quem dá os alvos da rede é o box abaixo, e são perguntas diferentes.

# ---------------------------------------------------------------------------
# O box que NÃO dimensiona equipamento nenhum.
#
# `equipment = "pinch"` resolve num `PinchTarget`, que é o ALVO da análise e não um
# casco — o contrato pede um `AbstractEquipment` e o catálogo exige que um box ativo o
# resolva no registro. Ver src/analysis/pinch_method.jl.
# ---------------------------------------------------------------------------

[[box]]
id        = "analise-pinch"
titulo    = "Análise Pinch — alvos de energia"
subtitulo = "Quanta utilidade quente e fria a rede exige, no mínimo — Kemp (2007), cap. 2-3"
icone     = "pinch"
estado    = "ativo"
equipment = "pinch"
method    = "pinch_kemp"

# ---------------------------------------------------------------------------
# Planejados. `motivo` é o que o cartão diz em vez de simplesmente não responder ao
# clique — um botão morto sem explicação é pior que um botão ausente.
# ---------------------------------------------------------------------------

[[box]]
id        = "controle-separador"
titulo    = "Controle do separador trifásico"
subtitulo = "Malhas de nível, pressão e interface"
icone     = "controle"
estado    = "em_breve"
motivo    = "Escopo futuro, declarado no planejamento. Dimensionar e controlar são problemas diferentes; este box é a porta para o segundo."
