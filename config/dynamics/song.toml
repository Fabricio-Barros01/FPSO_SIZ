label    = "Fração de água nas gotículas do óleo (entrada)"
unit     = "–"
default  = 0.25
min      = 0.0
max      = 0.6
advanced = true
note     = "PROVISÓRIA: fixa a escala absoluta de φ; ajustar para reproduzir φ = 17,45 % de §3.1"

