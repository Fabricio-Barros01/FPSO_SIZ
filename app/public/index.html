<!--
  Corpo da tela de dimensionamento. A casca (cabeçalho do documento, barra de status,
  tag do script) está em `casca.html`; ver `pagina` em app/src/server.jl.

  Nada de conteúdo é escrito aqui: nem campo de entrada, nem rótulo de resultado, nem
  cabeçalho de tabela, nem figura. O formulário nasce em app.js a partir de
  /api/<box>/esquema; o cartão, de `result_fields`; a tabela, de `sweep_columns`; as
  figuras, de `figuras`. Todos declarados pelo método, no core.

  É a regra de src/interfaces.jl — a interface nunca cita um parâmetro pelo nome —
  estendida no Sprint 7 às GRANDEZAS. Por isso esta mesma página serve o separador
  trifásico, o vaso bifásico e, sem uma linha de diferença, o que vier depois.
-->
<header class="topo">
  <!--
    A logo vive em public/, não em References/: aquela pasta guarda bibliografia de
    terceiros e está no .gitignore, enquanto isto é um recurso da aplicação e precisa
    ser copiado para dentro do bundle do PackageCompiler junto com o resto de public/.
  -->
  <img class="marca" src="/senai-cetiqt.webp" alt="SENAI CETIQT" width="860" height="131">
  <h1>FPSO_Siz</h1>
  <span class="equipamento" id="rotulo-equipamento">—</span>
  <span class="metodo" id="rotulo-metodo">—</span>
  <div class="acoes">
    <!-- Voltar não descarta nada: o estado de cada box vive no servidor, num
         `Dict` por box (ver `estado_atual` em server.jl). Sair do separador para
         abrir o knockout e voltar encontra o separador como estava. -->
    <a id="link-menu" class="voltar" href="/" title="Voltar ao menu">←&nbsp; Menu</a>
    <button id="btn-dimensionar" class="primario" type="button">▶&nbsp; Dimensionar</button>
    <button id="btn-exportar" type="button">⬇&nbsp; Exportar</button>
    <!-- Fechar a aba não encerraria o servidor: ele é um processo à parte, e o
         usuário ficaria com o programa rodando sem nada na tela. -->
    <button id="btn-sair" class="sair" type="button" title="Encerra o programa">Sair</button>
  </div>
</header>

<main>
  <!-- ------------------------------------------------ coluna 1: casos -->
  <section class="coluna casos">
    <h2>Casos / correntes</h2>

    <!--
      Barra de arquivo. Até o Sprint 3 o conjunto de casos era carregado uma vez, na
      abertura, e o que se editasse na tela morria com o processo — o programa não
      tinha como guardar um estudo. O seletor lista os exemplos de fábrica e o que o
      usuário salvou; "Salvar" grava numa pasta gravável (ver `dir_casos()` em
      src/config.jl), que num programa instalado NÃO é a pasta do próprio programa.
    -->
    <div class="arquivo">
      <label for="sel-arquivo">arquivo de casos</label>
      <select id="sel-arquivo"></select>
      <div class="botoes">
        <button id="btn-abrir" type="button">Abrir</button>
        <button id="btn-salvar" type="button">Salvar</button>
        <button id="btn-salvar-como" type="button">Salvar como…</button>
      </div>
    </div>

    <hr class="divisor">

    <select id="sel-caso" aria-label="Caso selecionado"></select>

    <div class="botoes">
      <button id="btn-novo" type="button">+ Novo</button>
      <button id="btn-duplicar" type="button">Duplicar</button>
      <button id="btn-remover" type="button">Remover</button>
    </div>

    <label class="nome-caso">
      nome
      <input id="nome-caso" type="text" autocomplete="off">
    </label>

    <label class="ativo">
      <input id="chk-ativo" type="checkbox">
      <span>caso ativo (entra no envelope)</span>
    </label>

    <p class="dica">
      Cada entrada é uma faixa. Valores iguais = fixo;<br>
      diferentes = expandido em casos de canto.
    </p>

    <!--
      `role="presentation"`: isto é grade de layout, não dado tabular — não há
      relação linha×coluna a navegar. Sem a marca, o leitor de tela entra em "modo
      tabela" e anuncia "linha 12 de 50, coluna 2" antes de cada caixa. O nome de
      cada caixa vem do `aria-label` que `linhaCampo` escreve (app.js). Só a árvore
      de acessibilidade muda; o visual continua o mesmo.
    -->
    <table class="form" id="form-campos" role="presentation">
      <thead>
        <tr><th></th><th>mín</th><th>máx</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- ------------------------------------------------ coluna 2: o equipamento -->
  <!--
    Três áreas, e nenhuma figura escrita aqui. Até o Sprint 6 esta coluna tinha
    `fig-vaso` e `fig-corte` fixos, o que amarrava a tela a quatro figuras de vaso: uma
    bomba não tem seção transversal, e o `<div>` ficaria vazio sem nada denunciar. Quem
    declara o que vai em cada área é o método — ver `figuras` em app/src/desenho.
  -->
  <section class="coluna equipamento">
    <h2 id="titulo-figura">—</h2>
    <div id="area-principal"></div>

    <div class="corte-linha">
      <div id="area-secundaria"></div>
      <!--
        A legenda de fases (gás / óleo / água) estava escrita aqui, e era o último
        pedaço de vaso na tela: uma bomba mostraria três amostras de cor para fases que
        ela não tem. Agora ela vem junto da figura que explica, declarada em `figuras`.
      -->
      <div id="legenda-figura"></div>
    </div>

    <div class="cursor">
      <!-- O rótulo vem de `sweep_axis`: "diâmetro" num vaso, "diâmetro nominal" numa
           bomba. Estava escrito à mão, e era a última grandeza que a tela nomeava. -->
      <label for="slider-d" id="rotulo-cursor">—</label>
      <input id="slider-d" type="range" min="0" max="0" step="1" value="0">
      <output id="valor-d">—</output>
    </div>
  </section>

  <!-- ------------------------------------------------ coluna 3: resultados -->
  <section class="coluna resultados">
    <h2>Resultado (envelope)</h2>
    <!--
      Vazios: rótulos e valores vêm de `result_fields`, declarados pelo método. Eram oito
      `<dt>` com os nomes do vaso ("Esbeltez SR", "Teto de decantação"), que uma bomba
      não teria como preencher. O mesmo vale para o cabeçalho da varredura abaixo.

      A nota que estava aqui continua valendo e mudou de lugar, para junto do rótulo, em
      `result_fields` de src/sizing/constraints.jl: "casco, entre tampos" não é
      preciosismo — `vessel_volume` é o cilindro sobre Lss, e os tampos elípticos 2:1 do
      desenho somariam ~8,5 %.
    -->
    <dl class="cartao" id="cartao"></dl>

    <h2>Varredura (vizinhança do ótimo)</h2>
    <table class="varredura">
      <thead><tr id="cabecalho-varredura"></tr></thead>
      <tbody id="corpo-varredura"></tbody>
    </table>

    <h2>Ajustes da varredura</h2>
    <table class="form" id="form-ajustes" role="presentation"><tbody></tbody></table>
  </section>
</main>

<!-- ------------------------------------------------ gráficos -->
<section class="graficos">
  <div id="area-grafico"></div>
  <div class="legenda">
    <h2>casos</h2>
    <div id="legenda-casos"></div>
  </div>
</section>

<!-- ------------------------------------------------ memorial de cálculo -->
<!--
  Recolhido por padrão e carregado só ao abrir. Duas razões, ambas concretas: a tela de
  três colunas já está cheia, e o memorial é consulta (confere-se uma vez, ao fechar o
  dimensionamento), não operação; e o rastro dos dez casos de canto do exemplo de
  referência é grande demais para viajar em toda resposta de "Dimensionar".

  O conteúdo é `<pre>`: as linhas vêm de `linha_memorial` em colunas de largura fixa —
  as MESMAS que o `.txt` exportado grava. Ver `memorial` em app/src/api.jl.
-->
<details class="memorial" id="memorial">
  <summary>Memorial de cálculo</summary>
  <div class="memorial-corpo">
    <label class="memorial-caso">
      caso
      <select id="sel-memorial" aria-label="Caso mostrado no memorial de cálculo"></select>
    </label>
    <div id="corpo-memorial"></div>
  </div>
</details>
