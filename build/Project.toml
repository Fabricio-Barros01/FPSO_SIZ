# O PackageCompiler mora aqui, e não em app/Project.toml, de propósito: tudo o que
# estiver no ambiente da aplicação entra no sysimage do executável. O compilador não
# tem nada que ir junto para a máquina do usuário.

[deps]
PackageCompiler = "9b87118b-4619-50d2-8e1e-99f35a4d4d9d"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"

[compat]
PackageCompiler = "2.4"
julia = "1.10"
